openapi: 3.1.0
info:
  title: Puddle API
  version: 0.1.0
  description: |
    The owner API: the desktop app and phone clients talking to **their own Puddle**.
    Other Puddles use the stream API instead (`federation.yaml`).

    Vocabulary (see CLAUDE.md): a *Puddle* is the app on a user's computer; a *stream* is a trusted
    connection between two Puddles.

    Conventions:
    - JSON everywhere, UTF-8. Versioned under `/api/v1`; `/health` is unversioned and public.
    - Request bodies have a size limit per route, decided from the headers before any of the body is read (4 MiB
      at most, whatever a route allows). Over it, the owner gets `413`. `Transfer-Encoding` (chunked) is not
      supported, and a GET or HEAD may not carry a body.
    - Only GET and POST are used. GET reads and never changes anything; POST does everything else
      (including delete and unblock, which are `.../delete` and `.../unblock`).
    - Errors use the `Error` schema.
    - **Nothing is public.** Every route needs `Authorization: Bearer <owner token>`. A request without
      a valid token is answered `404`, exactly like a path that doesn't exist, so a stranger can't tell
      that a route is there. (The Puddle's own log says why, for the owner.) The 401s below are
      therefore never sent; they are listed only for routes that an owner can reach with a bad session.
    - Users are identified by `UserId` (hash of their key; survives address changes). Messages are
      identified by `EventId` (hash of the message's bytes).
    - Messages are always listed in chat order, oldest first, and paged with `before` + `limit`.
    - Edit and delete are events in the chat's log. Delete is a request to hide, not a guarantee:
      other Puddles may ignore it.
    - Profiles are defined in the owner's YAML files, not through this API. The API lists them,
      reloads the files, and chooses which profile each stream sees.
    - Things that finish later (a stream request, a group invite, adding a group member) return
      immediately with a pending state. The outcome arrives on `/api/v1/events`.

servers:
  - url: https://localhost:8443
    description: Default listener (self-signed certificate; pin or trust it explicitly)

tags:
  - name: system
    description: Liveness
  - name: me
    description: This Puddle's owner
  - name: identity
    description: This Puddle's keys and user id
  - name: profiles
    description: The owner's profiles (defined in YAML files, see docs/profiles.md)
  - name: streams
    description: Trusted connections to other Puddles ("friends")
  - name: conversations
    description: Everything the owner can read, DMs and groups together
  - name: dm
    description: Direct messages. Need an active stream with the other person.
  - name: groups
    description: Group chats ("gm"). Anyone in the group can propose adding someone they share a stream with.
  - name: blocks
    description: Hard blocks, by user id
  - name: events
    description: Live updates

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check
      description: Needs the owner token like everything else; without it, `404`. `200` while the Puddle is up.
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok }

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Who this Puddle's owner is
      description: Includes the `link` to share so others can request a stream.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  # --- identity -----------------------------------------------------------------
  /api/v1/identity:
    get:
      tags: [identity]
      operationId: getIdentity
      summary: Your user id and key status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }

  /api/v1/identity/roll:
    post:
      tags: [identity]
      operationId: rollIdentity
      summary: Start replacing your keys (optional), step 1 of 2
      description: |
        Never happens on its own. Send your **current** recovery phrase, which authorizes the roll. The
        Puddle makes a **new phrase** and returns it; **nothing has changed yet**, and the old phrase still
        works. Show the new phrase to the owner, and once it is written down call `identity/roll/confirm`.
        Starting again replaces an unfinished roll; one left for 10 minutes is dropped. A phrase that is
        mistyped, or that is an older one (spent by an earlier roll), is `400 bad_phrase` with a `message`
        the owner can read. Use a roll after losing a device that held your keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrase]
              properties:
                phrase: { type: string, description: "Your current recovery phrase, e.g. `K7QM-2XPD-…`" }
      responses:
        "200":
          description: Prepared. The only time the new phrase is shown; it is stored nowhere.
          content:
            application/json:
              schema:
                type: object
                required: [new_phrase, expires_in]
                properties:
                  new_phrase: { type: string }
                  expires_in: { type: integer, description: Seconds to confirm in }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/identity/roll/confirm:
    post:
      tags: [identity]
      operationId: confirmRoll
      summary: The new phrase is written down, step 2 of 2
      description: |
        Commits the roll started by `identity/roll`: the keys are replaced, the old private key is deleted
        from this computer, and from now on only the new phrase counts. Your user id does not change.
        Sending the new keys to every active stream arrives with the streams (docs/roadmap.md, phase 4).
        `409 no_roll_pending` if none was started, it was cancelled, or it timed out.
      responses:
        "200":
          description: Rolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "409":
          description: No roll waiting to be confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/identity/roll/cancel:
    post:
      tags: [identity]
      operationId: cancelRoll
      summary: Keep the old keys
      description: Drops a started roll. Harmless if none is waiting.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean, description: False if there was nothing to cancel }

  # --- profiles ----------------------------------------------------------------
  /api/v1/profile:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: Your profiles
      description: The first one is the default.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnProfile" }

  /api/v1/profile/reload:
    post:
      tags: [profiles]
      operationId: reloadProfiles
      summary: Re-read the profile files
      description: |
        Picks up edits to the YAML files and their images, then sends changed profiles to the streams
        that see them. If a file has a mistake, nothing changes and the error says where.
      responses:
        "200":
          description: The profiles now in use
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/media:
    get:
      tags: [profiles]
      operationId: getMedia
      summary: An image by hash
      description: Profile images, yours or your friends'. Cached forever; the hash never changes meaning.
      parameters:
        - name: hash
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- streams -----------------------------------------------------------------
  /api/v1/stream:
    get:
      tags: [streams]
      operationId: listStreams
      summary: Streams, including pending requests in both directions
      description: |
        Most recently changed first, in pages. `next` is the `offset` of the following page, or `null` at the
        end. A page can be shorter than `limit` when its entries are large.
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/StreamState" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [streams, next]
                properties:
                  streams:
                    type: array
                    items: { $ref: "#/components/schemas/Stream" }
                  next: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/stream/request:
    post:
      tags: [streams]
      operationId: requestStream
      summary: Ask another Puddle to become friends
      description: |
        Sends a stream request to the target, with an optional short note ("hey it's Jayden from work").
        Returns a `pending_out` stream; it becomes `active` when they accept. Requesting someone who
        has blocked you looks exactly like a request that is still pending. The other Puddle can only answer
        if it can reach you, so this needs this Puddle's public address (`409 no_address`; set `advertise:`).
        `409` also for `already_streaming`, `already_requested`, `they_asked` (they have asked you; accept
        instead) and `blocked`. If the other Puddle can be found but refuses the request (not a Puddle, wrong
        id) the stream goes to `closed` with an `error` saying why; if it is simply away the request waits and
        is retried.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamRequest" }
      responses:
        "201":
          description: Request sent (or queued if the target is unreachable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/stream/accept:
    post:
      tags: [streams]
      operationId: acceptStream
      summary: Accept a request someone sent you
      description: |
        Only for a `pending_in` stream (`409 not_waiting` otherwise). The stream is active at once; telling the
        requester is queued and retried until it gets through (docs/roadmap.md 3.4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamRef" }
      responses:
        "200":
          description: Now active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/stream/decline:
    post:
      tags: [streams]
      operationId: declineStream
      summary: Decline a request someone sent you
      description: |
        Only for a `pending_in` stream (`409 not_waiting` otherwise). The requester is told it was declined. To
        refuse silently and permanently, block them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamRef" }
      responses:
        "204": { description: Declined }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/stream/invite:
    post:
      tags: [streams]
      operationId: createInvite
      summary: Make an invite link that is approved automatically
      description: |
        The link is `puddle://<your id>@<address>?invite=<token>`. Whoever requests a stream with it
        is accepted without waiting for you, until it expires or its uses run out. Share it only with
        people you mean to let in.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uses: { type: integer, minimum: 1, maximum: 1000, default: 1 }
                expires_in:
                  type: integer
                  minimum: 60
                  default: 604800
                  description: Seconds; default one week
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            `no_address`: this Puddle doesn't know its public address, so there is nothing to put in the link.
            Set `advertise: host:port` in `puddle.yaml`. Or `cannot_create`: too many live invites (64).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [streams]
      operationId: listInvites
      summary: Your live invites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }

  /api/v1/stream/invite/revoke:
    post:
      tags: [streams]
      operationId: revokeInvite
      summary: Cancel an invite so its link stops working
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stream/policy:
    get:
      tags: [streams]
      operationId: getAccessPolicy
      summary: What happens when a stranger asks for a stream
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPolicy" }
    post:
      tags: [streams]
      operationId: setAccessPolicy
      summary: Change what happens when a stranger asks for a stream
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessPolicy" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/stream/profile:
    post:
      tags: [streams]
      operationId: setStreamProfile
      summary: Choose which of your profiles a stream sees
      description: |
        Takes effect immediately and is pushed to that peer, who fetches any pictures it does not hold. `profile: null`
        goes back to your default profile. Anyone you have not assigned a profile sees the default. The choice is kept
        for a stream that is not open yet, and used when it is. `400 unknown_profile` for an id you do not have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream, profile]
              properties:
                stream: { type: string }
                profile:
                  type: [string, "null"]
                  pattern: "^[a-z0-9_-]{1,32}$"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stream/trust:
    post:
      tags: [streams]
      operationId: trustStreamCertificate
      summary: Accept a peer's new certificate
      description: |
        Every Puddle makes its own TLS certificate, so none can be checked against a CA. What we do keep is
        its fingerprint, recorded when we first connect. If a peer shows a different one (it was reinstalled,
        or something else is answering at that address), nothing is sent to it, what was waiting is held,
        and the stream shows `certificate_changed`. If you know the change is genuine, say so here; sending
        resumes. `409 nothing_to_trust` if nothing is waiting on you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamRef" }
      responses:
        "200":
          description: Trusted; held messages are on their way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/stream/delete:
    post:
      tags: [streams]
      operationId: deleteStream
      summary: Dry up a stream
      description: |
        Closes the connection and tells the peer. Not a block: they can ask again. Existing DM history stays;
        sending stops until a new stream exists. For an `active` stream, or a request you made that is still
        `pending_out` (withdrawing it); `409 not_open` for any other state (answer a request waiting on you
        with decline).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamRef" }
      responses:
        "204": { description: Closed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # --- conversations -------------------------------------------------------------
  # --- direct messages ------------------------------------------------------------
  /api/v1/dm/send:
    post:
      tags: [dm]
      operationId: sendDm
      summary: Send a direct message
      description: |
        Needs an open stream with `to` (`403 no_stream`, also for someone you have blocked). The message is
        signed, saved in the chat, and queued for delivery, which is retried while they are away. A body is 1 to
        4000 characters of text with no control characters but newline and tab (`400 bad_body`). `500 not_queued`
        means it was saved here but could not be queued; its `id` is in the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmSend" }
      responses:
        "201":
          description: Stored and queued for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/NoStream" }

  /api/v1/dm/edit:
    post:
      tags: [dm]
      operationId: editDm
      summary: Edit one of your direct messages
      description: |
        Only your own messages (`404 not_found` for someone else's, or one that is not there), and only while you have an
        open stream (`403 no_stream`). The new text is a message body (`400 bad_body`). A message already taken back cannot
        be edited (`409 deleted`). The edit is its own signed event, queued for delivery; the message keeps its place and
        its time, and the last edit is the text. Answers with the message as it now reads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageEdit" }
      responses:
        "200":
          description: Edit stored and queued for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/dm/delete:
    post:
      tags: [dm]
      operationId: deleteDm
      summary: Delete one of your direct messages (a request to hide it)
      description: |
        Takes back one of your own messages: it stays in the chat as a gap (`deleted`, no body), in its place, and the other
        side is asked to hide it too, which an honest Puddle does. It is a request: a Puddle that copied the text can
        keep it. Same rules as an edit for who and when; deleting one that is already gone is `204` and sends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageRef" }
      responses:
        "204": { description: Delete stored and queued for delivery }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/conversations:
    get:
      tags: [dm]
      operationId: listConversations
      summary: The chats that have messages, most recent first
      description: |
        One entry per person we have a chat with, newest activity first, with the last message and how many
        incoming messages have arrived since the chat was last marked read (counted up to 99). Includes people whose
        stream is closed, since history stays. A deleted last message has no `preview`. `next` is the `offset` for the
        following page, `null` at the end.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversations, next]
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      required: [user, stream, last, unread]
                      properties:
                        user: { $ref: "#/components/schemas/UserId" }
                        stream: { type: string, enum: [pending_out, pending_in, active, closed] }
                        last:
                          type: object
                          required: [id, sender, ts, outgoing]
                          properties:
                            id: { type: string }
                            sender: { $ref: "#/components/schemas/UserId" }
                            ts: { type: integer, format: int64 }
                            outgoing: { type: boolean }
                            deleted: { type: boolean }
                            preview: { type: string, description: "The first 120 characters, on one line." }
                        unread: { type: integer, minimum: 0, maximum: 99 }
                  next: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/dm/read:
    post:
      tags: [dm]
      operationId: markDmRead
      summary: Mark the chat with this user as read, up to now
      description: The marker only moves forward and is kept by the Puddle, so every app of the owner sees the same unread counts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { $ref: "#/components/schemas/UserId" }
      responses:
        "204": { description: Marked }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/dm/retry:
    post:
      tags: [dm]
      operationId: retryDm
      summary: Try again to deliver what is stuck for this user
      description: |
        Messages and edits that failed are queued again, and the ones waiting for a retry are tried now.
        `404` when there is nothing to retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { $ref: "#/components/schemas/UserId" }
      responses:
        "204": { description: Trying again }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/dm/messages:
    get:
      tags: [dm]
      operationId: listDmMessages
      summary: Messages in the DM with this user
      description: |
        Newest page first by default: `offset` counts messages from the newest, and the page itself is in
        chat order, oldest first. `next` is the `offset` for the page before this one, `null` at the start. A page
        can hold fewer than `limit` messages when they are long. History stays after a stream is closed.
      parameters:
        - { name: user, in: query, required: true, schema: { $ref: "#/components/schemas/UserId" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages, next]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }

  # --- groups ---------------------------------------------------------------------
  /api/v1/gm/create:
    post:
      tags: [groups]
      operationId: createGroup
      summary: Start a group chat
      description: |
        Every initial member must already share an active stream with you. Each is sent an invite and
        asked to accept. Members who share no stream with each other get a group-only connection when
        they accept; it does not make them friends.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: Created, with invites out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/NoStream" }

  /api/v1/gm/send:
    post:
      tags: [groups]
      operationId: sendGroupMessage
      summary: Send a message to a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupSend" }
      responses:
        "201":
          description: Stored and queued for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gm/edit:
    post:
      tags: [groups]
      operationId: editGroupMessage
      summary: Edit one of your group messages
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageEdit" }
      responses:
        "200":
          description: Edit stored and queued for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gm/delete:
    post:
      tags: [groups]
      operationId: deleteGroupMessage
      summary: Delete one of your group messages (a request to hide it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageRef" }
      responses:
        "204": { description: Delete stored and queued for delivery }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gm/{group}/messages:
    get:
      tags: [groups]
      operationId: listGroupMessages
      summary: Messages in a group
      parameters:
        - { $ref: "#/components/parameters/GroupIdPath" }
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gm/{group}/members:
    post:
      tags: [groups]
      operationId: addGroupMember
      summary: Propose adding someone to a group
      description: |
        You must share an active stream with them. Every current member's Puddle must approve (each
        checks its own blocks, automatically); one refusal vetoes the add. Always returns `202`; the
        result arrives as a `group.member_added` or `group.member_refused` event. A refusal does not
        say who refused or why.
      parameters:
        - { $ref: "#/components/parameters/GroupIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { $ref: "#/components/schemas/UserId" }
      responses:
        "202": { description: Proposal published; waiting for approvals }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/NoStream" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gm/{group}/leave:
    post:
      tags: [groups]
      operationId: leaveGroup
      summary: Leave a group
      parameters:
        - { $ref: "#/components/parameters/GroupIdPath" }
      responses:
        "204": { description: Left }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gm/invites:
    get:
      tags: [groups]
      operationId: listGroupInvites
      summary: Group invites waiting for your answer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupInvite" }

  /api/v1/gm/invites/{invite}/accept:
    post:
      tags: [groups]
      operationId: acceptGroupInvite
      summary: Join the group
      description: |
        Refused with `403` if anyone listed in the invite is on your block list. Joining does not make
        you friends with the other members.
      parameters:
        - { $ref: "#/components/parameters/InviteId" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403":
          description: A member of the group is blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gm/invites/{invite}/decline:
    post:
      tags: [groups]
      operationId: declineGroupInvite
      summary: Decline the invite
      description: The inviter is told "declined" and nothing else.
      parameters:
        - { $ref: "#/components/parameters/InviteId" }
      responses:
        "204": { description: Declined }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- blocks ---------------------------------------------------------------------
  /api/v1/user/block:
    get:
      tags: [blocks]
      operationId: listBlocks
      summary: Your block list
      description: Oldest first, in pages like the stream list (`limit`, `offset`, `next`).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [blocks, next]
                properties:
                  blocks:
                    type: array
                    items: { $ref: "#/components/schemas/Block" }
                  next: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [blocks]
      operationId: blockUser
      summary: Block a Puddle by user id
      description: |
        A hard block, by id rather than address, so changing address does not get around it. It
        closes any stream with them and is silent: they are not told, and their requests and invites
        look like ordinary pending ones. You also refuse group invites that include them, and your
        Puddle refuses to let them be added to groups you are in. Different from deleting a stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { $ref: "#/components/schemas/UserId" }
      responses:
        "201":
          description: Blocked (blocking someone already blocked keeps the first time)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/user/unblock:
    post:
      tags: [blocks]
      operationId: unblockUser
      summary: Remove a block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { $ref: "#/components/schemas/UserId" }
      responses:
        "204": { description: Unblocked }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- live updates -----------------------------------------------------------------
  /api/v1/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live updates (Server-Sent Events)
      description: |
        A long-lived `text/event-stream`. Each event's `event:` is one of the types below and `data:`
        is JSON. Reconnect with `Last-Event-ID` to catch up.

        - `message.new`, `message.edited`, `message.deleted`: data is a `Message`
        - `stream.requested`: someone asked you; data is a `Stream` (`pending_in`)
        - `stream.active`, `stream.closed`: data is a `Stream`
        - `group.invited`: data is a `GroupInvite`
        - `group.joined`: you joined; data is a `Group`
        - `group.member_added`, `group.member_refused`: data is `{group, user}` (refusals never say who refused)
        - `profile.updated`: a friend changed their profile; data is `{user, profile}`
        - `peer.key_changed`: a friend's keys rolled and verified; data is `{user, seq}`. If one fails to
          verify, `peer.key_rejected` with `{user}` instead.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The owner token: 64 hex characters, made on first run and kept in `<data_dir>/state/owner-token`
        (mode 0600). The app on the same machine and the owner's own tools use it. Phone clients get
        their own token when the owner approves them (docs/identity.md, "Devices").

  parameters:
    UserIdPath:
      name: user
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UserId" }
    GroupIdPath:
      name: group
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ChatId" }
    InviteId:
      name: invite
      in: path
      required: true
      schema: { type: string }
    Before:
      name: before
      in: query
      description: Only messages before this one (the id of the oldest message you already have)
      schema: { $ref: "#/components/schemas/EventId" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    UserId:
      type: string
      description: Hash of the user's first signing key and first roll-key commitment, base32, lowercase
      pattern: "^[a-z2-7]{52}$"
    EventId:
      type: string
      description: SHA-256 of the event's bytes, hex
      pattern: "^[0-9a-f]{64}$"
    ChatId:
      type: string
      description: For a group, the id of its creating event
      pattern: "^[A-Za-z0-9_-]{1,128}$"

    Hex:
      type: string
      description: A color, lowercase "#rrggbb"
      pattern: "^#[0-9a-f]{6}$"

    Color:
      type: object
      description: One color is solid; two to five make a gradient
      required: [colors]
      properties:
        colors:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/Hex" }
        angle:
          type: integer
          minimum: 0
          maximum: 360
          description: Gradient direction in degrees (default 180). Ignored for a solid color.

    MediaRef:
      type: object
      description: An image, fetched by hash from `/api/v1/media`
      required: [hash, mime, size]
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        mime: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        size: { type: integer, format: int64 }

    Profile:
      type: object
      description: |
        How a person appears to someone they share a stream with. Everything but `display_name` is
        optional. Limits (characters): display_name 64, blurb 160, about 2000, pronouns 32.
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        avatar: { $ref: "#/components/schemas/MediaRef" }
        blurb: { type: string, maxLength: 160, description: A short line }
        about: { type: string, maxLength: 2000, description: The longer description }
        pronouns: { type: string, maxLength: 32 }
        color: { $ref: "#/components/schemas/Color" }
        banner: { $ref: "#/components/schemas/MediaRef" }
        background: { $ref: "#/components/schemas/MediaRef" }

    OwnProfile:
      description: One of your own profiles, with the private `id` you use to refer to it. The id is never sent to anyone.
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [id, default]
          properties:
            id: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
            default: { type: boolean, description: Shown to anyone you have not assigned a profile }

    Person:
      type: object
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/UserId" }
        profile:
          description: What they showed us; absent until they have (a request we sent, not yet answered)
          $ref: "#/components/schemas/Profile"

    Me:
      type: object
      required: [id, profile, link]
      properties:
        id: { $ref: "#/components/schemas/UserId" }
        profile:
          description: Your default profile
          $ref: "#/components/schemas/OwnProfile"
        link:
          type: [string, "null"]
          description: Share this so others can request a stream, `puddle://<user id>@<address>`; `null` when the address isn't known (see Identity)
          example: puddle://ab…@203.0.113.7:8443

    AccessPolicy:
      type: object
      required: [access]
      properties:
        access:
          type: string
          enum: [open, manual, closed]
          description: |
            `manual` (default): requests wait for you. `open`: anyone is accepted at once. `closed`:
            strangers are ignored, silently; the sender just keeps waiting and is never told. A valid
            invite link works unless this is `closed`.

    Identity:
      type: object
      required: [id, link, seq, key_id]
      properties:
        id: { $ref: "#/components/schemas/UserId" }
        link:
          type: [string, "null"]
          description: |
            Share this to be asked for a stream. `null` while the Puddle listens on every interface and has no
            `advertise:` address in its config, because then it can't tell which address others should use.
        seq:
          type: integer
          minimum: 0
          description: How many times the keys have rolled
        key_id:
          type: string
          description: Hex SHA-256 of the current signing public key; changes when keys roll

    Invite:
      type: object
      required: [link, token, expires_at, uses]
      properties:
        link: { type: string }
        token: { type: string, description: The token in the link; what you revoke }
        expires_at: { type: integer, format: int64, description: UTC ms }
        uses: { type: integer, description: Uses remaining }

    StreamState:
      type: string
      enum: [pending_out, pending_in, active, closed]
      description: |
        `pending_out` you asked, `pending_in` they asked and are waiting on you, `active` trusted
        in both directions, `closed` dried up.

    Stream:
      type: object
      required: [id, peer, state]
      properties:
        id: { type: string, description: The peer's user id }
        peer: { $ref: "#/components/schemas/Person" }
        state: { $ref: "#/components/schemas/StreamState" }
        address: { type: string, description: Where we reach them, host:port }
        error:
          type: string
          description: Why a request of yours, or an answer you owed, did not get through; absent when nothing went wrong
        certificate_changed:
          type: boolean
          description: |
            Their TLS certificate is not the one we first saw, so nothing is being sent to them until you
            confirm with `stream/trust`. Absent otherwise.
        created_at: { type: integer, format: int64, description: UTC ms }
        message:
          type: string
          description: The note sent with the request
        profile:
          type: string
          description: The id of your profile this peer sees
        updated_at: { type: integer, format: int64, description: UTC ms }

    StreamRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: A `puddle://` link. If it has `?invite=`, the request is accepted automatically.
        message: { type: string, maxLength: 500 }
        profile:
          type: string
          description: Which of your profiles to introduce yourself with (default if omitted)

    StreamRef:
      type: object
      required: [stream]
      properties:
        stream: { type: string }

    Message:
      type: object
      required: [id, chat, sender, ts, outgoing]
      properties:
        id: { $ref: "#/components/schemas/EventId" }
        chat:
          type: string
          description: DM chat ids are derived from the two user ids
        sender: { $ref: "#/components/schemas/UserId" }
        ts:
          type: integer
          format: int64
          description: UTC ms, the sender's clock
        body: { type: string, maxLength: 4000, description: "The current text; absent once the message has been taken back" }
        outgoing: { type: boolean, description: Sent by you }
        received_at: { type: integer, format: int64, description: UTC ms, when this Puddle stored it }
        edited: { type: boolean, description: "Present, true, when it has been edited" }
        edited_at: { type: integer, format: int64, description: "UTC ms, the time of the last edit" }
        deleted: { type: boolean, description: "Present, true, when its author has taken it back" }
        reply_to: { $ref: "#/components/schemas/EventId" }
        delivery:
          type: object
          description: |
            Only on your own messages that have not been delivered yet; absent once they have (or when nothing is known).
            `queued` is waiting for a first attempt, `retrying` means the other Puddle could not be reached (it will be tried again
            at `next_at`), `failed` will not be retried by itself (see `reason`; `dm/retry` tries again), `held` is waiting for you to
            trust their changed certificate.
          required: [state, attempts]
          properties:
            state: { type: string, enum: [queued, retrying, failed, held] }
            reason: { type: string }
            next_at: { type: integer, format: int64, description: "UTC ms, with `retrying`" }
            attempts: { type: integer }

    MessageRef:
      type: object
      required: [user, message]
      properties:
        user: { $ref: "#/components/schemas/UserId", description: "The other person in the conversation" }
        message: { $ref: "#/components/schemas/EventId" }

    MessageEdit:
      type: object
      required: [user, message, body]
      properties:
        user: { $ref: "#/components/schemas/UserId", description: "The other person in the conversation" }
        message: { $ref: "#/components/schemas/EventId" }
        body: { type: string, minLength: 1, maxLength: 4000 }

    DmSend:
      type: object
      required: [to, body]
      properties:
        to: { $ref: "#/components/schemas/UserId" }
        body: { type: string, minLength: 1, maxLength: 4000 }
        reply_to: { $ref: "#/components/schemas/EventId" }

    GroupSend:
      type: object
      required: [group, body]
      properties:
        group: { $ref: "#/components/schemas/ChatId" }
        body: { type: string, minLength: 1, maxLength: 4000 }
        reply_to: { $ref: "#/components/schemas/EventId" }

    GroupCreate:
      type: object
      required: [name, members]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        members:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/UserId" }

    GroupMember:
      type: object
      required: [id, profile, state]
      properties:
        id: { $ref: "#/components/schemas/UserId" }
        profile: { $ref: "#/components/schemas/Profile" }
        state: { type: string, enum: [invited, member] }

    Group:
      type: object
      required: [id, name, members]
      properties:
        id: { $ref: "#/components/schemas/ChatId" }
        name: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }

    GroupInvite:
      type: object
      required: [id, group, name, from, members]
      properties:
        id: { type: string }
        group: { $ref: "#/components/schemas/ChatId" }
        name: { type: string }
        from: { $ref: "#/components/schemas/Person" }
        members:
          type: array
          description: Everyone else in the group, so you can see who you would be joining
          items: { $ref: "#/components/schemas/Person" }

    Conversation:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          description: The peer's UserId for a DM, the group id for a group
        kind: { type: string, enum: [dm, group] }
        name: { type: string }
        last_message: { $ref: "#/components/schemas/Message" }
        unread: { type: integer, minimum: 0 }

    Block:
      type: object
      required: [user, created_at]
      properties:
        user: { $ref: "#/components/schemas/UserId" }
        created_at: { type: integer, format: int64 }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message
        code:
          type: string
          description: "Stable machine-readable code, e.g. `no_stream`, `already_streaming`, `invalid_link`."

  responses:
    BadRequest:
      description: Malformed or invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not allowed in the current state (for example already streaming with them)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoStream:
      description: "You do not share an active stream with them (code `no_stream`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

# Everything is authenticated unless an operation sets `security: []`.
security:
  - bearerAuth: []
