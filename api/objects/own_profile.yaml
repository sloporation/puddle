$schema: https://json-schema.org/draft/2020-12/schema
title: OwnProfile
description: One of the owner's profiles, with the private id used to refer to it. The id is never sent to anyone.
allOf:
  - $ref: "../wire/profile.yaml"
  - type: object
    required: [id, default]
    properties:
      id: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
      default: { type: boolean, description: Shown to anyone not assigned a profile }
