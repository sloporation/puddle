openapi: 3.1.0
info:
  title: Puddle Stream API
  version: 0.1.0
  description: |
    How one Puddle talks to another over a stream. Not used by apps or phone clients; they use
    `openapi.yaml`. (This file keeps its old name, `federation.yaml`.)

    This is the thin slice a demo needs: becoming friends, delivering messages, and group invites.
    Ponds will implement the same core later.

    Conventions:
    - JSON over HTTPS, versioned under `/stream/v1`. Peers are found by the address in their link.
    - Only GET and POST are used. GET reads and never changes anything; POST does everything else.
    - **Events are sent as strings.** An event's id is the SHA-256 of its exact bytes, so `event` is the
      raw JSON text as a string, never re-serialized. See docs/storage.md.
    - Group membership votes are ordinary events (`member.propose`, `member.approve`, `member.deny`,
      `member.add`, `member.leave`) delivered through `/stream/v1/events`. A group's add only counts
      if the log holds an approval from every member it builds on; each Puddle checks this itself.
    - There is deliberately no endpoint for blocks. A blocked sender is answered exactly like an
      ordinary pending request, and never told.
    - Group-only connections (a "scoped stream") use `/stream/v1/access` with `scope` set.

    Still to decide: the exact signature scheme, retries and ordering, and key rotation records.

servers:
  - url: https://localhost:8443

tags:
  - name: info
    description: Public
  - name: access
    description: Becoming trusted
  - name: delivery
    description: Messages and profile changes over an existing stream
  - name: groups
    description: Group invites

paths:
  /stream/v1/info:
    get:
      tags: [info]
      operationId: getInfo
      summary: Who this Puddle is and whether it takes requests
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /stream/v1/identity:
    get:
      tags: [info]
      operationId: getIdentityChain
      summary: This Puddle's key chain
      description: |
        Public. The chain is checked by the reader against the user id in the link they followed, so
        it cannot be swapped for someone else's.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chain" }
    post:
      tags: [access]
      operationId: pushIdentityChain
      summary: Tell a peer your keys rolled
      description: |
        Sent to every active stream after a roll. The recipient verifies the chain extends the one it
        holds (same id, same earlier records, one or more new ones, each signed by the committed
        keys). Authenticated by that chain rather than by a stored key, since the signing key has just
        changed. A chain that does not verify is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Chain" }
      responses:
        "204": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/address:
    post:
      tags: [access]
      operationId: pushAddress
      summary: Tell a peer where to reach you now
      description: The highest `seq` wins. Peers keep every address they have heard of, newest first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressRecord" }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/access:
    post:
      tags: [access]
      operationId: requestAccess
      summary: Ask for a stream
      description: |
        Always answered `202` with `pending` unless the target decides immediately. A blocked
        requester gets `pending` too and the request is silently dropped. Set `scope` to ask for a
        group-only connection: the target auto-approves if `scope.proof` is a membership event it
        already holds for that group.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequest" }
      responses:
        "202":
          description: Received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessState" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /stream/v1/access/result:
    post:
      tags: [access]
      operationId: sendAccessResult
      summary: Tell the requester what the owner decided
      description: Called by the target on the requester's Puddle once the owner accepts or declines.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessResult" }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/access/status:
    get:
      tags: [access]
      operationId: getAccessStatus
      summary: What became of the request I sent you
      description: For a requester whose Puddle missed the result call. Answers for the caller only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stream/v1/close:
    post:
      tags: [access]
      operationId: closeStream
      summary: Tell the peer this stream is closed
      description: Sent when the owner deletes a stream. A block sends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { $ref: "#/components/schemas/Scope" }
      responses:
        "204": { description: Closed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/events:
    post:
      tags: [delivery]
      operationId: deliverEvents
      summary: Deliver signed events for one chat
      description: |
        Messages, edits, deletes and group membership events. Safe to repeat: events already held
        are reported as duplicates. Events for a chat the sender is not allowed in (no stream, not a
        group member, or a scoped stream for a different chat) are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Delivery" }
      responses:
        "200":
          description: Per-event outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/profile:
    post:
      tags: [delivery]
      operationId: pushProfile
      summary: The sender changed the profile you see
      description: Sent whenever the owner edits the profile shown to you, or assigns you a different one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { $ref: "#/components/schemas/Profile" }
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/media:
    get:
      tags: [delivery]
      operationId: getMedia
      summary: An image from the sender's profile
      description: |
        Only images in the profile the owner shows *you* are served; anything else is `404`, as if it
        did not exist. The hash is the SHA-256 of the file; check it. Size limits are still to be decided.
      parameters:
        - name: hash
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stream/v1/group/invite:
    post:
      tags: [groups]
      operationId: inviteToGroup
      summary: Invite someone you share a stream with into a group
      description: |
        The invitee's Puddle checks the stream and the member list against its blocks, then asks its
        owner. It answers later with `/stream/v1/group/invite/response`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInvite" }
      responses:
        "202": { description: Received }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/group/invite/response:
    post:
      tags: [groups]
      operationId: answerGroupInvite
      summary: The invitee's answer
      description: Only "accepted" or "declined"; never a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, accepted]
              properties:
                group: { $ref: "#/components/schemas/ChatId" }
                accepted: { type: boolean }
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    streamSignature:
      type: apiKey
      in: header
      name: X-Puddle-Signature
      description: |
        `v1 id=<sender id>; kid=<key id>; ts=<ms>; nonce=<base64>; sig=<base64>`, where `kid` is the hex
        SHA-256 of the sender's signing public key and `sig` is an Ed25519 signature over the lines
        `puddle-request-v1`, method, request target (path and query), hex SHA-256 of the body, `ts`,
        `nonce`, and the recipient's user id. The recipient checks it is the recipient, `ts` is within
        five minutes of its clock, the nonce is new, `kid` is the sender's current key, and the
        signature. Full rules in docs/streams.md.

  schemas:
    UserId:
      type: string
      pattern: "^[a-z2-7]{52}$"
    EventId:
      type: string
      pattern: "^[0-9a-f]{64}$"
    ChatId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"

    Hex:
      type: string
      description: A color, lowercase "#rrggbb"
      pattern: "^#[0-9a-f]{6}$"

    Color:
      type: object
      description: One color is solid; two to five make a gradient
      required: [colors]
      properties:
        colors:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/Hex" }
        angle:
          type: integer
          minimum: 0
          maximum: 360
          description: Gradient direction in degrees (default 180). Ignored for a solid color.

    MediaRef:
      type: object
      description: An image, fetched by hash from `/stream/v1/media`
      required: [hash, mime, size]
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        mime: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        size: { type: integer, format: int64 }

    Profile:
      type: object
      description: |
        How a person appears to someone they share a stream with. Everything but `display_name` is
        optional. Limits (characters): display_name 64, blurb 160, about 2000, pronouns 32.
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        avatar: { $ref: "#/components/schemas/MediaRef" }
        blurb: { type: string, maxLength: 160, description: A short line }
        about: { type: string, maxLength: 2000, description: The longer description }
        pronouns: { type: string, maxLength: 32 }
        color: { $ref: "#/components/schemas/Color" }
        banner: { $ref: "#/components/schemas/MediaRef" }
        background: { $ref: "#/components/schemas/MediaRef" }


    Chain:
      type: object
      description: |
        A Puddle's identity chain. Each element is one line of `chain.jsonl`, exactly as written
        (`{"record":{...},"sig":"..."}`), because the signatures cover the exact bytes. Verified with
        the rules in docs/identity.md; the reader pins it to the id they expect.
      required: [chain]
      properties:
        chain:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: string }

    AddressRecord:
      type: object
      description: |
        `record` is the exact JSON text `{"type":"address","id":..,"addresses":[..],"seq":N,"ts":..}`,
        signed with the sender's current key; `sig` is base64.
      required: [record, sig]
      properties:
        record: { type: string }
        sig: { type: string }

    Peer:
      type: object
      required: [id, profile, address, chain]
      properties:
        id: { $ref: "#/components/schemas/UserId" }
        profile: { $ref: "#/components/schemas/Profile" }
        address:
          type: string
          description: host:port this Puddle can be reached at
        chain: { $ref: "#/components/schemas/Chain" }

    Info:
      type: object
      required: [id, kind, name, access]
      properties:
        id: { $ref: "#/components/schemas/UserId" }
        kind: { type: string, enum: [puddle, pond] }
        name: { type: string }
        access:
          type: string
          enum: [open, manual, closed]
          description: |
            What happens to a request with no invite. `open` accepts at once, `manual` waits for the
            owner, `closed` refuses with `access_closed`.
        versions:
          type: array
          items: { type: string }

    Scope:
      type: object
      description: Limits a stream to one group. Absent means a full friendship.
      required: [group]
      properties:
        group: { $ref: "#/components/schemas/ChatId" }
        proof:
          type: string
          description: A membership event (raw JSON text) showing the sender was added to the group

    AccessRequest:
      type: object
      required: [requester]
      properties:
        requester: { $ref: "#/components/schemas/Peer" }
        message: { type: string, maxLength: 500 }
        invite:
          type: string
          description: Token from an invite link; a valid one is approved at once
        scope: { $ref: "#/components/schemas/Scope" }

    AccessState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [pending, approved, declined] }

    AccessResult:
      type: object
      required: [responder, approved]
      properties:
        responder: { $ref: "#/components/schemas/Peer" }
        approved: { type: boolean }
        scope: { $ref: "#/components/schemas/Scope" }

    SignedEvent:
      type: object
      required: [id, event, sig]
      properties:
        id: { $ref: "#/components/schemas/EventId" }
        event:
          type: string
          description: The event's exact JSON text. `id` is the SHA-256 of these bytes.
        sig: { type: string, description: Sender's signature over the same bytes, base64 }

    Delivery:
      type: object
      required: [chat, events]
      properties:
        chat: { $ref: "#/components/schemas/ChatId" }
        events:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/SignedEvent" }

    DeliveryResult:
      type: object
      required: [accepted, duplicate, rejected]
      properties:
        accepted:
          type: array
          items: { $ref: "#/components/schemas/EventId" }
        duplicate:
          type: array
          items: { $ref: "#/components/schemas/EventId" }
        rejected:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: { $ref: "#/components/schemas/EventId" }
              reason: { type: string }

    GroupInvite:
      type: object
      required: [group, name, create_event, members]
      properties:
        group: { $ref: "#/components/schemas/ChatId" }
        name: { type: string }
        create_event:
          $ref: "#/components/schemas/SignedEvent"
        members:
          type: array
          description: Everyone in the group, with the details needed to reach and verify them
          items: { $ref: "#/components/schemas/Peer" }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: |
            One of `bad_signature`, `clock_skew` (the reply says its time), `replayed`, `unknown_key`,
            `no_stream`, `access_closed`, `rate_limited`.

  responses:
    BadRequest:
      description: Malformed or invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing, or not one you are allowed to see
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Bad signature, or no stream with this sender
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - streamSignature: []
