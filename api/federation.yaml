openapi: 3.1.0
info:
  title: Puddle Stream API
  version: 0.1.0
  description: |
    How one Puddle talks to another over a stream. Not used by apps or phone clients; they use
    `openapi.yaml`. (This file keeps its old name, `federation.yaml`.)

    This is the thin slice a demo needs: becoming friends, delivering messages, and group invites.
    Ponds will implement the same core later.

    **There are no public endpoints.** Every request is signed (see `streamSignature`). One that fails
    any check, up to and including the signature, gets the same `404` as a path that does not exist, so
    a stranger learns nothing, not even that this is a Puddle. The one request a Puddle must take from
    someone it doesn't know is `POST /stream/v1/access`, and it answers that identically whatever it
    decides.

    Conventions:
    - JSON over HTTPS, versioned under `/stream/v1`. Peers are found by the address in their link.
    - Bodies are limited per route (4 MiB at most), decided before they are read. A request over its limit is
      answered `404`, like anything else a stranger sends. Chunked bodies are not supported.
    - Only GET and POST are used. GET reads and never changes anything; POST does everything else.
    - **Events are sent as strings.** An event's id is the SHA-256 of its exact bytes, so `event` is the
      raw JSON text as a string, never re-serialized. See docs/storage.md.
    - Group membership votes are ordinary events (`member.propose`, `member.approve`, `member.deny`,
      `member.add`, `member.leave`) delivered through `/stream/v1/events`. A group's add only counts
      if the log holds an approval from every member it builds on; each Puddle checks this itself.
    - There is deliberately no endpoint for blocks. A blocked sender is answered exactly like an
      ordinary pending request, and never told.
    - Group-only connections (a "scoped stream") use `/stream/v1/access` with `scope` set.

    Still to decide: the exact signature scheme, retries and ordering, and key rotation records.

servers:
  - url: https://localhost:8443

tags:
  - name: access
    description: Becoming trusted
  - name: delivery
    description: Messages and profile changes over an existing stream
  - name: groups
    description: Group invites

paths:
  /stream/v1/identity:
    get:
      tags: [access]
      operationId: getIdentityChain
      summary: This Puddle's key chain
      description: |
        Signed like everything else, answered only to a known peer. Used by an owner recovering after
        losing a device, who signs with keys re-derived from their recovery phrase.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChainBody" }
    post:
      tags: [access]
      operationId: pushIdentityChain
      summary: Tell a peer your keys rolled
      description: |
        Sent after a roll to every peer that holds our chain (an active stream, or a request of ours still waiting),
        ahead of anything else queued for them: what else is waiting was signed with the new key, which they will
        not believe until they have this. The recipient takes it only if it is the chain it already holds for that id
        plus more records, each verifying; anything else is ignored. The request is authenticated by the new chain in
        the body (the signing key has just changed), which any stranger could do with a chain of their own, so it is
        **always answered `202`**: what counts is that it continues a chain we hold, which only the owner of the keys can
        produce. Items already queued for the peer are signed again (the key id is outside the signed bytes), and
        what carried our old chain (a request, an answer) is rewritten to carry the new.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChainBody" }
      responses:
        "202": { description: Received }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/address:
    post:
      tags: [access]
      operationId: pushAddress
      summary: Tell a peer where to reach you now
      description: |
        Where the sender is now, signed by its current key. Sent to every active stream when its address or its
        TLS certificate changes (it notices at start). The highest `seq` wins; one that is not newer, or that
        carries no addresses, leaves what we hold alone. A `tls_fp` in it is the fingerprint of the sender's new
        certificate: since the record is signed by a key we already trust, it is accepted without asking, and anything
        held back for the owner on account of that certificate is released. (A certificate that changes **without**
        being announced still holds sending until the owner says it is fine.) Addresses we would never connect to
        (unspecified, multicast, link-local) are refused. Answered `400 bad_record` for a record that does not check
        out, `204` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressRecord" }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/access:
    post:
      tags: [access]
      operationId: requestAccess
      summary: Ask for a stream
      description: |
        The one request a Puddle takes from a stranger. It is signed with the requester's key, checkable
        because the requester's `chain` is in the body. A request that does not check out (malformed, a
        chain that is not the requester's, a bad or missing signature, a replay) is answered `404`, exactly
        like a path that does not exist. One that does is **always answered `202` with an empty body,
        whatever is decided**: blocked, refused by policy, rate-limited, over capacity, approved at once or
        left waiting for the owner are indistinguishable, and dropped ones are dropped silently. The
        requester's `profile` is read for `display_name`, `blurb`, `about` and `pronouns` only (cleaned and
        length-limited); pictures and colors come later, over the stream. At most 96 KiB. The outcome arrives later at the requester's `access/result`, or by polling
        `access/status`. Set `scope` to ask for a group-only connection: the target auto-approves if
        `scope.proof` is a membership event it already holds for that group.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequest" }
      responses:
        "202": { description: Received. Says nothing about what will happen. }

  /stream/v1/access/result:
    post:
      tags: [access]
      operationId: sendAccessResult
      summary: Tell the requester what the owner decided
      description: |
        Called by the target on the requester's Puddle once the owner accepts or declines (or at once, when an
        invite or an open policy let them in). Like the request, it is proven by the chain in its body: the
        requester has no keys of the target's yet, only the id from the link it followed, so it accepts an
        answer only from a Puddle whose chain belongs to exactly that id, signed by that chain's key, for a request
        it has sent and not yet had answered. Anything else is dropped. **Always `202` once it authenticates**
        (a stranger can authenticate with any key of their own, so the answer must say nothing); an answer that is
        accepted shows only in the requester's own state. A decline carries the responder's chain too, as the
        requester could not otherwise tell it from a forgery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessResult" }
      responses:
        "202": { description: Received }

  /stream/v1/access/status:
    post:
      tags: [access]
      operationId: getAccessStatus
      summary: What became of the request I sent you
      description: |
        For a requester whose Puddle missed the answer. A POST rather than a GET, and chain-proven like the request,
        because the target may hold nothing about the requester (a request it ignored leaves no trace), and so
        could not otherwise tell who is asking. It answers `approved` (with its own `responder` details) only to
        a requester it has an active stream with, `declined` to one whose stream it closed, and **`pending` to
        everyone else**: blocked, ignored because it is closed to requests, never heard of. So no answer reveals a
        block, a closed door, or that the request was seen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requester]
              properties:
                requester: { $ref: "#/components/schemas/Peer" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessState" }

  /stream/v1/close:
    post:
      tags: [access]
      operationId: closeStream
      summary: Tell the peer this stream is closed
      description: |
        Sent when the owner deletes a stream (or withdraws a request that is still waiting). A block sends nothing.
        Signed with a key the recipient already holds, so it can be answered plainly: `403 no_stream` if there is
        no open stream or request from the sender to close.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { $ref: "#/components/schemas/Scope" }
      responses:
        "204": { description: Closed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NoStream" }

  /stream/v1/events:
    post:
      tags: [delivery]
      operationId: deliverEvents
      summary: Deliver signed events for one chat
      description: |
        Messages (edits, deletes and group membership events follow). Signed by the sender's **current** key,
        so a key that has since been replaced, which is what a stolen phone leaves behind, cannot deliver. Safe
        to repeat: events already held are reported as `duplicate`. The sender must have an open stream
        (`403 no_stream`), and `chat` must be the direct-message chat between the two of you (`400`).
        At most 100 events and 256 KiB; more than that is refused whole. Each event is then judged on its own, and
        a `rejected` entry says why: `malformed`, `too_large`, `bad_id` (the id is not the SHA-256 of the bytes),
        `bad_signature`, `unknown_key` (signed by a key that is not the sender's current one),
        `unsupported_type`, `wrong_chat`, `wrong_sender` (the event names someone other than the sender),
        `bad_time` (not between the years 2000 and 2100), `bad_body`, `storage_error`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Delivery" }
      responses:
        "200":
          description: Per-event outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/profile:
    post:
      tags: [delivery]
      operationId: pushProfile
      summary: The sender changed the profile you see
      description: Sent whenever the owner edits the profile shown to you, or assigns you a different one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { $ref: "#/components/schemas/Profile" }
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/media:
    get:
      tags: [delivery]
      operationId: getMedia
      summary: An image from the sender's profile
      description: |
        Only images in the profile the owner shows *you* are served; anything else is `404`, as if it
        did not exist. The hash is the SHA-256 of the file; check it. Size limits are still to be decided.
      parameters:
        - name: hash
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stream/v1/group/invite:
    post:
      tags: [groups]
      operationId: inviteToGroup
      summary: Invite someone you share a stream with into a group
      description: |
        The invitee's Puddle checks the stream and the member list against its blocks, then asks its
        owner. It answers later with `/stream/v1/group/invite/response`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInvite" }
      responses:
        "202": { description: Received }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stream/v1/group/invite/response:
    post:
      tags: [groups]
      operationId: answerGroupInvite
      summary: The invitee's answer
      description: Only "accepted" or "declined"; never a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, accepted]
              properties:
                group: { $ref: "#/components/schemas/ChatId" }
                accepted: { type: boolean }
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    streamSignature:
      type: apiKey
      in: header
      name: X-Puddle-Signature
      description: |
        `v1 id=<sender id>; kid=<key id>; ts=<ms>; nonce=<base64>; sig=<base64>`, where `kid` is the hex
        SHA-256 of the sender's signing public key and `sig` is an Ed25519 signature over the lines
        `puddle-request-v1`, method, request target (path and query), hex SHA-256 of the body, `ts`,
        `nonce`, and the recipient's user id. The recipient checks it is the recipient, `ts` is within
        five minutes of its clock, the nonce is new, `kid` is the sender's current key, and the
        signature. Full rules in docs/streams.md.

  schemas:
    UserId:
      type: string
      pattern: "^[a-z2-7]{52}$"
    EventId:
      type: string
      pattern: "^[0-9a-f]{64}$"
    ChatId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"

    Hex:
      type: string
      description: A color, lowercase "#rrggbb"
      pattern: "^#[0-9a-f]{6}$"

    Color:
      type: object
      description: One color is solid; two to five make a gradient
      required: [colors]
      properties:
        colors:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/Hex" }
        angle:
          type: integer
          minimum: 0
          maximum: 360
          description: Gradient direction in degrees (default 180). Ignored for a solid color.

    MediaRef:
      type: object
      description: An image, fetched by hash from `/stream/v1/media`
      required: [hash, mime, size]
      properties:
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        mime: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        size: { type: integer, format: int64 }

    Profile:
      type: object
      description: |
        How a person appears to someone they share a stream with. Everything but `display_name` is
        optional. Limits (characters): display_name 64, blurb 160, about 2000, pronouns 32.
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        avatar: { $ref: "#/components/schemas/MediaRef" }
        blurb: { type: string, maxLength: 160, description: A short line }
        about: { type: string, maxLength: 2000, description: The longer description }
        pronouns: { type: string, maxLength: 32 }
        color: { $ref: "#/components/schemas/Color" }
        banner: { $ref: "#/components/schemas/MediaRef" }
        background: { $ref: "#/components/schemas/MediaRef" }


    Chain:
      type: string
      maxLength: 65536
      description: |
        A Puddle's identity chain: the text of its `chain.jsonl`, one record per line, exactly as written
        (`{"record":{...},"sig":"..."}`), because the signatures cover the exact bytes. Verified with the
        rules in docs/identity.md; the reader pins it to the id they expect.

    ChainBody:
      type: object
      required: [chain]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }

    AddressRecord:
      type: object
      description: |
        `record` is the exact JSON text
        `{"type":"address","id":..,"addresses":[..],"tls_fp":"<64 hex>","seq":N,"ts":..}` (`tls_fp` optional), and `sig`
        is `<key id>:<base64>` over `puddle-address-v1\n` followed by those bytes, made with the sender's current key.
      required: [record, sig]
      properties:
        record: { type: string }
        sig: { type: string }

    Peer:
      type: object
      required: [id, profile, address, chain]
      properties:
        id: { $ref: "#/components/schemas/UserId" }
        profile: { $ref: "#/components/schemas/Profile" }
        address:
          type: string
          description: host:port this Puddle can be reached at
        chain: { $ref: "#/components/schemas/Chain" }

    Scope:
      type: object
      description: Limits a stream to one group. Absent means a full friendship.
      required: [group]
      properties:
        group: { $ref: "#/components/schemas/ChatId" }
        proof:
          type: string
          description: A membership event (raw JSON text) showing the sender was added to the group

    AccessRequest:
      type: object
      required: [requester]
      properties:
        requester: { $ref: "#/components/schemas/Peer" }
        message: { type: string, maxLength: 500 }
        invite:
          type: string
          description: Token from an invite link; a valid one is approved at once
        scope: { $ref: "#/components/schemas/Scope" }

    AccessState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [pending, approved, declined] }
        responder:
          description: "With `approved`: who the target is, as in an access result"
          $ref: "#/components/schemas/Peer"

    AccessResult:
      type: object
      required: [responder, approved]
      properties:
        responder: { $ref: "#/components/schemas/Peer" }
        approved: { type: boolean }
        scope: { $ref: "#/components/schemas/Scope" }

    SignedEvent:
      type: object
      required: [id, event, sig]
      properties:
        id: { $ref: "#/components/schemas/EventId" }
        event:
          type: string
          description: The event's exact JSON text. `id` is the SHA-256 of these bytes.
        sig:
          type: string
          description: |
            `<key id>:<base64 signature>`: the key id is the hex SHA-256 of the signing public key, and the
            signature is Ed25519 over `puddle-event-v1\n` followed by the event's bytes. The key id is outside
            the signed bytes, so a Puddle that has changed keys can sign the same event again without
            changing its id.

    Delivery:
      type: object
      required: [chat, events]
      properties:
        chat: { $ref: "#/components/schemas/ChatId" }
        events:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SignedEvent" }

    DeliveryResult:
      type: object
      required: [accepted, duplicate, rejected]
      properties:
        accepted:
          type: array
          items: { $ref: "#/components/schemas/EventId" }
        duplicate:
          type: array
          items: { $ref: "#/components/schemas/EventId" }
        rejected:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: { $ref: "#/components/schemas/EventId" }
              reason: { type: string }

    GroupInvite:
      type: object
      required: [group, name, create_event, members]
      properties:
        group: { $ref: "#/components/schemas/ChatId" }
        name: { type: string }
        create_event:
          $ref: "#/components/schemas/SignedEvent"
        members:
          type: array
          description: Everyone in the group, with the details needed to reach and verify them
          items: { $ref: "#/components/schemas/Peer" }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: |
            Only given to an authenticated peer: `clock_skew` (the reply says its time), `replayed`,
            `no_stream`. A request that fails authentication gets a plain `404` with no code.

  responses:
    BadRequest:
      description: Malformed or invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing, or not one you are allowed to see
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authenticated, but not acceptable now (`clock_skew`, `replayed`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoStream:
      description: "Authenticated, but you share no open stream with us (code `no_stream`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - streamSignature: []
